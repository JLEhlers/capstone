
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "replace-with-a-private-secret-key"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: "News_App"
      DB_USER: "newsuser"
      DB_PASSWORD: "NewsAppLocalTest2026!"
      DB_HOST: "db"
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: "News_App"
      MARIADB_USER: "newsuser"
      MARIADB_PASSWORD: "NewsAppLocalTest2026!"
      MARIADB_ROOT_PASSWORD: "NewsAppRootLocal2026!"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
